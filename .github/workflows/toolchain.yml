name: toolchain

on: 
  workflow_dispatch:
    inputs:
      platform:
        description: '选择要构建的平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
  # push:
  #   tags: ["*"]

env:
  CT_VERSION: 1.26.0

jobs:
  # Linux 平台作业
  build-linux-uclibc:
    name: Build Linux uClibc Toolchain
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    # 只在选择 Linux 或 all 时运行
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare (Ubuntu)
        run: |
          sudo apt update
          sudo apt install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin
      - name: Build
        run: |
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-${PLATFORM}-v${CT_VERSION}.tar.xz *
        env:
          CT_TARGET: mipsel-linux-uclibc
          PLATFORM: linux
        working-directory: toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-uclibc-linux
          path: toolchain/mipsel-linux-uclibc-linux-v${{ env.CT_VERSION }}.tar.xz

  build-linux-musl:
    name: Build Linux musl Toolchain
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    # 只在选择 Linux 或 all 时运行
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare (Ubuntu)
        run: |
          sudo apt update
          sudo apt install unzip libtool-bin curl cmake gperf gawk flex bison nano xxd \
            fakeroot kmod cpio git python3-docutils gettext automake autopoint \
            texinfo build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin
      - name: Build
        run: |
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-${PLATFORM}-v${CT_VERSION}.tar.xz *
        env:
          CT_TARGET: mipsel-linux-musl
          PLATFORM: linux
        working-directory: toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-musl-linux
          path: toolchain/mipsel-linux-musl-linux-v${{ env.CT_VERSION }}.tar.xz

  # macOS 平台作业
  build-macos-uclibc:
    name: Build macOS uClibc Toolchain
    runs-on: macos-14
    env:
      TZ: Asia/Shanghai
    # 只在选择 macOS 或 all 时运行
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare (macOS)
        run: |
          # Install required packages via Homebrew
          brew install coreutils gnu-sed gawk flex bison gettext texinfo help2man \
            pkg-config gmp libmpc mpfr ncurses libtool autoconf automake wget curl xz bash binutils
          # Set GNU tool paths
          echo "/usr/local/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH
          echo "/usr/local/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
          echo "/usr/local/opt/gettext/bin" >> $GITHUB_PATH
          # Add binutils path to PATH (keg-only package)
          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH
          # Add both possible bash paths to PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
      - name: Set macOS Target Compatibility
        run: |
          # Set deployment target for macOS 10.15 compatibility
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
          echo "CFLAGS=-mmacosx-version-min=10.15" >> $GITHUB_ENV
          echo "CXXFLAGS=-mmacosx-version-min=10.15" >> $GITHUB_ENV
          echo "LDFLAGS=-mmacosx-version-min=10.15" >> $GITHUB_ENV
          # Set bash path for crosstool-ng (dynamically find bash)
          BASH_PATH=$(which bash)
          echo "CONFIG_SHELL=$BASH_PATH" >> $GITHUB_ENV
          echo "BASH=$BASH_PATH" >> $GITHUB_ENV
      - name: Build
        run: |
          # Configure for macOS 10.15 compatibility
          export MACOSX_DEPLOYMENT_TARGET=10.15
          export CFLAGS="-mmacosx-version-min=10.15"
          export CXXFLAGS="-mmacosx-version-min=10.15"
          export LDFLAGS="-mmacosx-version-min=10.15"
          # Ensure we use GNU tools and bash 5
          export PATH="/usr/local/opt/coreutils/libexec/gnubin:/usr/local/opt/gnu-sed/libexec/gnubin:/usr/local/opt/gettext/bin:/opt/homebrew/opt/binutils/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          # Dynamically find bash path
          BASH_PATH=$(which bash)
          export CONFIG_SHELL=$BASH_PATH
          export BASH=$BASH_PATH
          
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-${PLATFORM}-v${CT_VERSION}.tar.xz *
        env:
          CT_TARGET: mipsel-linux-uclibc
          PLATFORM: darwin
        working-directory: toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-uclibc-darwin
          path: toolchain/mipsel-linux-uclibc-darwin-v${{ env.CT_VERSION }}.tar.xz

  build-macos-musl:
    name: Build macOS musl Toolchain
    runs-on: macos-14
    env:
      TZ: Asia/Shanghai
    # 只在选择 macOS 或 all 时运行
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare (macOS)
        run: |
          # Install required packages via Homebrew
          brew install coreutils gnu-sed gawk flex bison gettext texinfo help2man \
            pkg-config gmp libmpc mpfr ncurses libtool autoconf automake wget curl xz bash binutils
          # Set GNU tool paths
          echo "/usr/local/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH
          echo "/usr/local/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
          echo "/usr/local/opt/gettext/bin" >> $GITHUB_PATH
          # Add binutils path to PATH (keg-only package)
          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH
          # Add both possible bash paths to PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
      - name: Set macOS Target Compatibility
        run: |
          # Set deployment target for macOS 10.15 compatibility
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
          echo "CFLAGS=-mmacosx-version-min=10.15" >> $GITHUB_ENV
          echo "CXXFLAGS=-mmacosx-version-min=10.15" >> $GITHUB_ENV
          echo "LDFLAGS=-mmacosx-version-min=10.15" >> $GITHUB_ENV
          # Set bash path for crosstool-ng (dynamically find bash)
          BASH_PATH=$(which bash)
          echo "CONFIG_SHELL=$BASH_PATH" >> $GITHUB_ENV
          echo "BASH=$BASH_PATH" >> $GITHUB_ENV
      - name: Build
        run: |
          # Configure for macOS 10.15 compatibility
          export MACOSX_DEPLOYMENT_TARGET=10.15
          export CFLAGS="-mmacosx-version-min=10.15"
          export CXXFLAGS="-mmacosx-version-min=10.15"
          export LDFLAGS="-mmacosx-version-min=10.15"
          # Ensure we use GNU tools and bash 5
          export PATH="/usr/local/opt/coreutils/libexec/gnubin:/usr/local/opt/gnu-sed/libexec/gnubin:/usr/local/opt/gettext/bin:/opt/homebrew/opt/binutils/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          # Dynamically find bash path
          BASH_PATH=$(which bash)
          export CONFIG_SHELL=$BASH_PATH
          export BASH=$BASH_PATH
          
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-${PLATFORM}-v${CT_VERSION}.tar.xz *
        env:
          CT_TARGET: mipsel-linux-musl
          PLATFORM: darwin
        working-directory: toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-musl-darwin
          path: toolchain/mipsel-linux-musl-darwin-v${{ env.CT_VERSION }}.tar.xz

  release:
    name: Release
    needs: 
      - build-linux-uclibc
      - build-linux-musl
      - build-macos-uclibc
      - build-macos-musl
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Toolchain Release ${{ github.ref_name }}
          body: |
            ## Padavan Toolchain Release ${{ github.ref_name }}
            
            This release contains cross-compilation toolchains for Padavan firmware development.
            
            ### Available Toolchains:
            
            #### Linux Platforms:
            - `mipsel-linux-uclibc-linux-v${{ env.CT_VERSION }}.tar.xz` - uClibc-based toolchain for Linux
            - `mipsel-linux-musl-linux-v${{ env.CT_VERSION }}.tar.xz` - musl-based toolchain for Linux
            
            #### macOS Platforms:
            - `mipsel-linux-uclibc-darwin-v${{ env.CT_VERSION }}.tar.xz` - uClibc-based toolchain for macOS
            - `mipsel-linux-musl-darwin-v${{ env.CT_VERSION }}.tar.xz` - musl-based toolchain for macOS
            
            ### Usage:
            1. Download the appropriate toolchain for your platform
            2. Extract to your development directory
            3. Set environment variables to use the toolchain
            
            For detailed usage instructions, please refer to the project documentation.
            
            ---
            *Built with Crosstool-NG v${{ env.CT_VERSION }}*
          files: artifacts/**/*.tar.xz
          draft: false
          prerelease: false
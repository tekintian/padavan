name: Toolchain Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - linux
          - macos
          - all

jobs:
  build-linux-uclibc:
    name: Build Linux uClibc Toolchain
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare Ubuntu Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git ccache bison flex texinfo help2man libtool automake libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev liblzma-dev libssl-dev
      
      - name: Build
        env:
          CT_TARGET: mipsel-linux-uclibc
          CT_VERSION: 1.26.0
        run: |
          cd toolchain
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-linux-v${CT_VERSION}.tar.xz *
      
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-uclibc-linux
          path: toolchain/mipsel-linux-uclibc-linux-v${{ env.CT_VERSION }}.tar.xz

  build-linux-musl:
    name: Build Linux musl Toolchain
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare Ubuntu Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git ccache bison flex texinfo help2man libtool automake libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev liblzma-dev libssl-dev
      
      - name: Build
        env:
          CT_TARGET: mipsel-linux-musl
          CT_VERSION: 1.26.0
        run: |
          cd toolchain
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-linux-v${CT_VERSION}.tar.xz *
      
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-musl-linux
          path: toolchain/mipsel-linux-musl-linux-v${{ env.CT_VERSION }}.tar.xz

  build-macos-uclibc:
    name: Build macOS uClibc Toolchain
    runs-on: macos-14
    env:
      TZ: Asia/Shanghai
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare macOS Environment
        run: |
          # Install required packages
          brew update
          brew install bash coreutils gnu-sed gawk git gettext libtool automake gmp mpfr libmpc zlib xz openssl@1.1 binutils
          # Add binutils to PATH
          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH
          
      - name: Patch case-sensitive checks for macOS
        run: |
          # Patch crosstool-NG.sh to bypass case-sensitivity checks
          sed -i '' '122s/CT_TestAndAbort/CT_DoLog WARN/' toolchain/crosstool-ng-1.26.0/scripts/crosstool-NG.sh
          sed -i '' '329s/CT_TestAndAbort/CT_DoLog WARN/' toolchain/crosstool-ng-1.26.0/scripts/crosstool-NG.sh
          
      - name: Build
        env:
          CT_TARGET: mipsel-linux-uclibc
          CT_VERSION: 1.26.0
          PLATFORM: darwin
        run: |
          cd toolchain
          export MACOSX_DEPLOYMENT_TARGET=10.15
          # 移除了 CFLAGS 和 CXXFLAGS 的设置
          export LDFLAGS="-mmacosx-version-min=10.15"
          # Ensure we use GNU tools and bash 5
          export PATH="/usr/local/opt/coreutils/libexec/gnubin:/usr/local/opt/gnu-sed/libexec/gnubin:/usr/local/opt/gettext/bin:/opt/homebrew/opt/binutils/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          # Dynamically find bash path
          BASH_PATH=$(which bash)
          export CONFIG_SHELL=$BASH_PATH
          export BASH=$BASH_PATH
          
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-${PLATFORM}-v${CT_VERSION}.tar.xz *
      
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-uclibc-darwin
          path: toolchain/mipsel-linux-uclibc-darwin-v${{ env.CT_VERSION }}.tar.xz

  build-macos-musl:
    name: Build macOS musl Toolchain
    runs-on: macos-14
    env:
      TZ: Asia/Shanghai
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare macOS Environment
        run: |
          # Install required packages
          brew update
          brew install bash coreutils gnu-sed gawk git gettext libtool automake gmp mpfr libmpc zlib xz openssl@1.1 binutils
          # Add binutils to PATH
          echo "/opt/homebrew/opt/binutils/bin" >> $GITHUB_PATH
          
      - name: Patch case-sensitive checks for macOS
        run: |
          # Patch crosstool-NG.sh to bypass case-sensitivity checks
          sed -i '' '122s/CT_TestAndAbort/CT_DoLog WARN/' toolchain/crosstool-ng-1.26.0/scripts/crosstool-NG.sh
          sed -i '' '329s/CT_TestAndAbort/CT_DoLog WARN/' toolchain/crosstool-ng-1.26.0/scripts/crosstool-NG.sh
          
      - name: Build
        env:
          CT_TARGET: mipsel-linux-musl
          CT_VERSION: 1.26.0
          PLATFORM: darwin
        run: |
          cd toolchain
          export MACOSX_DEPLOYMENT_TARGET=10.15
          # 移除了 CFLAGS 和 CXXFLAGS 的设置
          export LDFLAGS="-mmacosx-version-min=10.15"
          # Ensure we use GNU tools and bash 5
          export PATH="/usr/local/opt/coreutils/libexec/gnubin:/usr/local/opt/gnu-sed/libexec/gnubin:/usr/local/opt/gettext/bin:/opt/homebrew/opt/binutils/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
          # Dynamically find bash path
          BASH_PATH=$(which bash)
          export CONFIG_SHELL=$BASH_PATH
          export BASH=$BASH_PATH
          
          make CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd crosstool-ng-${CT_VERSION}/toolchain-mipsel
          tar cJf ../../${CT_TARGET}-${PLATFORM}-v${CT_VERSION}.tar.xz *
      
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-mipsel-linux-musl-darwin
          path: toolchain/mipsel-linux-musl-darwin-v${{ env.CT_VERSION }}.tar.xz

  release:
    name: Release Toolchain
    runs-on: ubuntu-22.04
    needs: [build-linux-uclibc, build-linux-musl, build-macos-uclibc, build-macos-musl]
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'macos'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: List artifacts
        run: ls -la artifacts/
      
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.CT_VERSION }}
          name: Toolchain Release v${{ env.CT_VERSION }}
          artifacts: |
            artifacts/toolchain-mipsel-linux-uclibc-linux/mipsel-linux-uclibc-linux-v${{ env.CT_VERSION }}.tar.xz
            artifacts/toolchain-mipsel-linux-musl-linux/mipsel-linux-musl-linux-v${{ env.CT_VERSION }}.tar.xz
            artifacts/toolchain-mipsel-linux-uclibc-darwin/mipsel-linux-uclibc-darwin-v${{ env.CT_VERSION }}.tar.xz
            artifacts/toolchain-mipsel-linux-musl-darwin/mipsel-linux-musl-darwin-v${{ env.CT_VERSION }}.tar.xz
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
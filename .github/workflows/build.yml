name: Padvan Firmware build

on:
  push:
    branches: ["dev"] # 触发分支
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # workflows: write  # 如果需要推送 tag 触发其他 workflow，取消注释此行

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    # 如果是 tag 触发,则不执行 branches 触发的任务
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        # 构建目标可选: K2P, K2P-NANO, K2P-TINY, K2P-USB
        # 还有 trunk/configs/templates/ 下的其他 xxx.config 配置中的名称xxx即为构建目标可选,
        # 如: K2P-NANO.config 文件,构建目标即 K2P-NANO
        target: [ K2P, K2P-NANO, K2P-TINY, K2P-USB]
        toolchain: [mipsel-linux-musl]
    steps:
      - uses: actions/checkout@v3
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.target }}-${{ matrix.toolchain }}
      - uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          check-latest: true
      - name: Prepare
        run: |
          sudo apt update
          sudo apt install libtool-bin gperf python3-docutils autopoint gettext ccache
      - name: Build
        run: |
          ROOTFS_VER=$(grep "FIRMWARE_ROOTFS_VER=" trunk/versions.inc | cut -d'=' -f2)
          BUILDS_VER=$(grep "FIRMWARE_BUILDS_VER=" trunk/versions.inc | cut -d'=' -f2)
          KERNEL_VER=$(grep "FIRMWARE_KERNEL_VER=" trunk/Makefile | cut -d'"' -f2)
          BUILDS_REV=$(git rev-parse --short=7 HEAD 2>/dev/null)
          # 如果 Git 命令失败（极端情况），用日期兜底
          if [ -z "$BUILDS_REV" ]; then
            BUILDS_REV=$(date +%Y%m%d)
          fi
          VERSION="${KERNEL_VER}.${ROOTFS_VER}-${BUILDS_VER}-${BUILDS_REV}"
          echo "FIRMWARE_VERSION=${VERSION}" >> $GITHUB_ENV

          make ${{ matrix.target }} TOOLCHAIN=${{ matrix.toolchain}}
          if [ "${{ matrix.target }}" = "K2P-NANO" ]; then
            image=$(ls trunk/images/*.trx)
            mv $image $(echo $image | sed 's/K2P/K2P-NANO/')
          fi
          if [ "${{ matrix.target }}" = "K2P-TINY" ]; then
            image=$(ls trunk/images/*.trx)
            mv $image $(echo $image | sed 's/K2P/K2P-TINY/')
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ env.FIRMWARE_VERSION }}
          path: trunk/images/*.trx

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    env:
      TZ: Asia/Shanghai
    # 仅在推送 tag 时发布
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/ # 统一存放下载的产物，避免文件冲突
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## 固件发布
            该发布包含以下固件：
            - K2P 标准固件,包含所有默认功能
            - K2P-NANO  精简版本固件,包含广告管理
            - K2P-TINY  极精简版本固件.不包含广告管理
            - K2P-USB  带 USB 端口的固件(只有改造过的机器才支持)

            构建详情：
            - 标签：${{ github.ref_name }}
            - 提交：${{ github.sha }}
          artifacts: "artifacts/**/*.trx" # 正确匹配所有下载的 trx 文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: macOS Toolchain Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - 'v*'
    paths:
      - 'toolchain/**'
      - '.github/workflows/macos_toolchain.yml'

jobs:
  build:
    name: build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      matrix:
        target: [mipsel-linux-musl]
        runner: [macos-15-intel]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare macOS Environment
        run: |
          brew update
          brew install \
            bash \
            coreutils \
            gnu-sed \
            gawk \
            git \
            gettext \
            libtool \
            automake \
            autoconf \
            gmp \
            mpfr \
            libmpc \
            zlib \
            xz \
            openssl@1.1 \
            binutils \
            texinfo \
            bison \
            flex \
            help2man \
            ncurses \
            ccache \
            pkg-config

          # Detect Homebrew prefix and add GNU tools to PATH
          if [[ "$(uname -m)" == "arm64" ]]; then
            HOMEBREW_PREFIX="/opt/homebrew"
            ARCH_SUFFIX="arm64"
          else
            HOMEBREW_PREFIX="/usr/local"
            ARCH_SUFFIX="x86_64"
          fi

          # Add GNU tools to PATH
          echo "${HOMEBREW_PREFIX}/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH
          echo "${HOMEBREW_PREFIX}/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
          echo "${HOMEBREW_PREFIX}/opt/gettext/bin" >> $GITHUB_PATH
          echo "${HOMEBREW_PREFIX}/opt/binutils/bin" >> $GITHUB_PATH
          echo "${HOMEBREW_PREFIX}/opt/texinfo/bin" >> $GITHUB_PATH
          echo "${HOMEBREW_PREFIX}/opt/bison/bin" >> $GITHUB_PATH
          echo "${HOMEBREW_PREFIX}/opt/flex/bin" >> $GITHUB_PATH

          # Save Homebrew prefix and architecture for later steps
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}" >> $GITHUB_ENV
          echo "ARCH_SUFFIX=${ARCH_SUFFIX}" >> $GITHUB_ENV

      - name: Build
        run: |
          cd toolchain
          eval "$(${HOMEBREW_PREFIX}/bin/brew shellenv)"
          export PATH="${HOMEBREW_PREFIX}/opt/bash/bin:$PATH"
          export BASH="${HOMEBREW_PREFIX}/opt/bash/bin/bash"
          echo "Using bash: $BASH"
          echo "Using homebrew prefix: $HOMEBREW_PREFIX"
          make -f macos.Makefile CT_TARGET=${CT_TARGET} CT_VERSION=${CT_VERSION}
          cd toolchain-mipsel/${CT_TARGET}
          tar cJf ../../${CT_TARGET}-darwin-${ARCH_SUFFIX}.tar.xz *
        env:
          CT_TARGET: ${{ matrix.target }}
          CT_VERSION: 1.26.0
          HOMEBREW_PREFIX: ${{ env.HOMEBREW_PREFIX }}
          ARCH_SUFFIX: ${{ env.ARCH_SUFFIX }}

      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.target }}-darwin-${{ env.ARCH_SUFFIX }}
          path: toolchain/${{ matrix.target }}-darwin-${{ env.ARCH_SUFFIX }}.tar.xz

      - name: Upload to toolchain (no tag)
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: toolchain/${{ matrix.target }}-darwin-${{ env.ARCH_SUFFIX }}.tar.xz
          tag: toolchain
          overwrite: true

      - name: Create release (with tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: toolchain/${{ matrix.target }}-darwin-${{ env.ARCH_SUFFIX }}.tar.xz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}